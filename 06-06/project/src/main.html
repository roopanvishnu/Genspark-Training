<!-- Navigation Bar -->
    <nav *ngIf="authService.isAuthenticated()" class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <div class="flex-shrink-0 flex items-center">
              <div class="h-8 w-8 bg-primary-600 rounded-lg flex items-center justify-center">
                <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <span class="ml-2 text-xl font-bold text-gray-900">Task Management Frontend</span>
            </div>
            
            <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
              <a routerLink="/dashboard" 
                 routerLinkActive="border-primary-500 text-gray-900" 
                 class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                </svg>
                Dashboard
              </a>
              <a routerLink="/tasks" 
                 routerLinkActive="border-primary-500 text-gray-900" 
                 class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                </svg>
                Tasks
              </a>
              <a routerLink="/users" 
                 routerLinkActive="border-primary-500 text-gray-900" 
                 class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                </svg>
                Users
              </a>
            </div>
          </div>

          <div class="flex items-center space-x-4">
            <!-- Notifications -->
            <div class="relative">
              <button (click)="showNotifications = !showNotifications" class="p-2 text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-3.405-3.405A2.032 2.032 0 0116 12V9a4 4 0 10-8 0v3a2.032 2.032 0 01-.595 1.595L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
                <span *ngIf="notifications.length > 0" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center notification-ping">
                  {{ notifications.length }}
                </span>
              </button>
              
              <!-- Notifications Dropdown -->
              <div *ngIf="showNotifications" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg ring-1 ring-black ring-opacity-5 z-50">
                <div class="p-4">
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-medium text-gray-900">Notifications</h3>
                    <button (click)="clearNotifications()" class="text-xs text-gray-500 hover:text-gray-700">Clear all</button>
                  </div>
                  <div class="space-y-2 max-h-64 overflow-y-auto">
                    <div *ngFor="let notification of notifications" class="p-2 bg-blue-50 rounded-lg">
                      <p class="text-sm text-blue-800">{{ notification }}</p>
                      <p class="text-xs text-blue-600 mt-1">Just now</p>
                    </div>
                    <div *ngIf="notifications.length === 0" class="text-center py-4 text-gray-500 text-sm">
                      No new notifications
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- User Menu -->
            <div class="relative">
              <button (click)="showUserMenu = !showUserMenu" class="flex items-center space-x-3 text-sm text-gray-700 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 rounded-full p-2">
                <div class="h-8 w-8 bg-gray-300 rounded-full flex items-center justify-center">
                  <span class="text-sm font-medium text-gray-700">
                    {{ currentUser?.firstName?.charAt(0) }}{{ currentUser?.lastName?.charAt(0) }}
                  </span>
                </div>
                <span class="hidden md:block">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </button>
              
              <!-- User Dropdown -->
              <div *ngIf="showUserMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg ring-1 ring-black ring-opacity-5 z-50">
                <div class="py-1">
                  <div class="px-4 py-2 text-sm text-gray-700 border-b">
                    <div class="font-medium">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</div>
                    <div class="text-gray-500">{{ currentUser?.email }}</div>
                    <div class="text-xs">
                      <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full" 
                            [ngClass]="{
                              'bg-purple-100 text-purple-800': currentUser?.role === 'Manager',
                              'bg-blue-100 text-blue-800': currentUser?.role === 'TeamMember'
                            }">
                        {{ currentUser?.role }}
                      </span>
                    </div>
                  </div>
                  <button (click)="logout()" 
                          class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                    <svg class="w-4 h-4 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Sign out
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile menu -->
      <div class="sm:hidden">
        <div class="pt-2 pb-3 space-y-1 border-t border-gray-200">
          <a routerLink="/dashboard" 
             routerLinkActive="bg-primary-50 border-primary-500 text-primary-700" 
             class="bg-transparent border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium transition-colors">
            Dashboard
          </a>
          <a routerLink="/tasks" 
             routerLinkActive="bg-primary-50 border-primary-500 text-primary-700" 
             class="bg-transparent border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium transition-colors">
            Tasks
          </a>
          <a routerLink="/users" 
             routerLinkActive="bg-primary-50 border-primary-500 text-primary-700" 
             class="bg-transparent border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium transition-colors">
            Users
          </a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="min-h-screen" [ngClass]="{'bg-gray-50': authService.isAuthenticated()}">
      <router-outlet></router-outlet>
    </main>
