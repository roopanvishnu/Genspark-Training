 <button matFab extended class="create-button" (click)="openModal()">
    <mat-icon>add_2</mat-icon>
    Create Category
</button>

<table mat-table [dataSource]="categories" class="mat-elevation-z8">

    <ng-container matColumnDef="Id">
        <th mat-header-cell *matHeaderCellDef> Id </th>
        <td mat-cell *matCellDef="let element"> {{element.categoryId}} </td>
    </ng-container>

    <ng-container matColumnDef="Name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="Operations">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element">
            <div class="buttons">
                <button matButton="tonal" (click)="openModal(element)">
                    <mat-icon>edit</mat-icon>
                    Edit
                </button>
                <button matButton="tonal" (click)="openDeleteDialog(element.name, element.categoryId)">
                    <mat-icon>delete</mat-icon>
                    Delete
                </button>

            </div>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

@if(showModal){
<div class="modal-overlay">
    <div class="modal">
        <h2>{{ editingCategory ? 'Edit Category' : 'Create Category' }}</h2>

        <form (submit)="onSubmit()">
            <mat-form-field>
                <mat-label>Name</mat-label>
                <input matInput [(ngModel)]="categoryFormName" name="name" required >
            </mat-form-field>

            <div class="modal-buttons">
                <button type="submit" mat-flat-button color="primary">{{ editingCategory ? 'Update' : 'Create'
                    }}</button>
                <button type="button" mat-button (click)="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>
}
